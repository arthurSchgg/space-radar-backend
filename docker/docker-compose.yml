services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-space_radar}
      POSTGRES_USER: ${DB_USERNAME:-space_radar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-space_radar} -d ${DB_NAME:-space_radar}"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8888
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-space_radar}
      DB_USERNAME: ${DB_USERNAME:-space_radar}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env}
      NASA_API_KEY: ${NASA_API_KEY:-DEMO_KEY}
      RADAR_ADMIN_TOKEN: ${RADAR_ADMIN_TOKEN:-}
      RADAR_CORS_ORIGINS: ${RADAR_CORS_ORIGINS:-http://localhost:5173,http://localhost:5500}
      RADAR_SYNC_ENABLED: ${RADAR_SYNC_ENABLED:-false}
      RADAR_SYNC_ON_STARTUP: ${RADAR_SYNC_ON_STARTUP:-false}
    ports:
      - "8181:8888"
volumes:
  postgres_data:
