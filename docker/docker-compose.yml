
services:
  postgres:
    image: postgres:17
    container_name: space-radar-db
    environment:
      POSTGRES_DB: ${DB_NAME:-space_radar}
      POSTGRES_USER: ${DB_USERNAME:-space_radar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: space-radar-app
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-space_radar}
      DB_USERNAME: ${DB_USERNAME:-space_radar}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      NASA_API_KEY: ${NASA_API_KEY:?Defina NASA_API_KEY no .env}
    ports:
      - "8181:8080"

volumes:
  postgres_data:
