spring.application.name=space-radar
server.port=${PORT:${SERVER_PORT:8080}}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:space_radar}
spring.datasource.username=${DB_USERNAME:space_radar}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
# Baseline old Hibernate-managed databases; V2 still applies indexes.
spring.flyway.baseline-on-migrate=true
spring.data.web.pageable.max-page-size=100

nasa.api.base-url=https://api.nasa.gov
nasa.api.key=${NASA_API_KEY:DEMO_KEY}
radar.import.token=${RADAR_ADMIN_TOKEN:}
radar.cors.allowed-origins=${RADAR_CORS_ORIGINS:http://localhost:5173,http://localhost:5500}
management.endpoints.web.exposure.include=health,info


# Optional NASA feed synchronization (UTC); disable by default for local development.
radar.sync.enabled=${RADAR_SYNC_ENABLED:false}
radar.sync.on-startup=${RADAR_SYNC_ON_STARTUP:false}
radar.sync.cron=${RADAR_SYNC_CRON:0 15 3 * * *}
